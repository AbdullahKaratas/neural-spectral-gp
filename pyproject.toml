[build-system]
requires = [
    "setuptools>=68.0.0",
    "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "nsgp"
version = "0.1.0"

readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.2",
    "gpytorch>=1.11",
    "linear_operator>=0.6.1"
]

# general development
[project.optional-dependencies]
develop = [
    "pre-commit>=2.8.2",
    "pandas",
    "seaborn",
    "pytest",
    "pytest-cov",
]

# all dependencies (mandatory and optional)
all = [
    "nsgp[develop]"
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["nsgp*"]
exclude = ["nsgp.tests*"]
